# cargo deny check: what the dependencies of the workspace may be, checked by the CI

[graph]
all-features = true

# the vulnerabilities and the crates no longer maintained, from the RustSec database
[advisories]
version = 2
yanked = "deny"

# the licenses the workspace, MIT, can depend on: permissive ones only
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# the crates of the workspace aren't published
ignore = true

[bans]
# two versions of a crate make the build longer, they don't fail it
multiple-versions = "warn"
wildcards = "deny"
# the path dependencies of the workspace
allow-wildcard-paths = true

# the crates come from crates.io only
[sources]
unknown-registry = "deny"
unknown-git = "deny"
