[package]
name = "kraken-dashboard"
description = "Terminal dashboard of kraken-trading-bot: its managers, their orders and their P&L, live from its database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# not published on crates.io: only kraken-crypto, kraken-network and kraken-spot-api are
publish = false

[[bin]]
name = "kraken-dashboard"
path = "src/main.rs"
required-features = ["terminal"]

[features]
# the dashboard in the terminal, on the database of the bot. Without it, the screen and its logic
# only, as a browser runs them: no crossterm, no SQLite, which don't compile to WebAssembly
default = ["terminal"]
terminal = ["ratatui/crossterm", "kraken-dashboard-data/database"]

[dependencies]
# what's read from the database of the bot
kraken-dashboard-data.workspace = true
ratatui.workspace = true
rust_decimal.workspace = true
# the settings of the screen, kept next to the database
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true

[dev-dependencies]
# the demo database and the tests are written by the storage of the bot itself
fastrand.workspace = true
kraken-spot-api.workspace = true
kraken-trading-bot.workspace = true
rusqlite.workspace = true
