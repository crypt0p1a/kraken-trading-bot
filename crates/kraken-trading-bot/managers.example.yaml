# Configuration of the managers of kraken-trading-bot
# The credentials are never written here: KRAKEN_API_KEY / KRAKEN_API_SECRET in the environment

# true: the orders are only validated by Kraken, never placed. Set it to false to trade for real
dry_run: true
# delay between two ticks
tick_interval: 5m
# a buy order not filled after this delay expires, and is placed again from the new price
buy_order_timeout: 12h

# notifications on the phone, through ntfy (topic in KRAKEN_BOT_NTFY_TOPIC):
# notifications:
#   ntfy:
#     server: https://ntfy.sh        # or a self-hosted server
#   language: en                     # en (default) or fr
#   events: [started, placed, filled, expired, failed, daily_summary]   # all by default
#   dry_run: false                   # true: also the orders of a dry run
#   daily_summary_hour: 20           # UTC

managers:
  # id: Kraken userref of the orders of the manager, from 1 to 2147483647, unique, never reused
  # budget: in the quote currency of the pair (USD for XBTUSD)
  # buy_below: buys at -buy_below% of the last price
  # sell_above: sells for what the position cost + sell_above%, fees included
  # mode: active (default) | closing (sells what it holds, doesn't buy anymore)
  # bitcoin: from small frequent moves to deep dips
  - id: 1
    pair: XBTUSD
    budget: 30
    buy_below: 0.5
    sell_above: 0.8
  - id: 2
    pair: XBTUSD
    budget: 30
    buy_below: 1.0
    sell_above: 1.5
  - id: 3
    pair: XBTUSD
    budget: 30
    buy_below: 2.0
    sell_above: 3.0
  - id: 4
    pair: XBTUSD
    budget: 30
    buy_below: 3.5
    sell_above: 5.0
  # ether: fewer managers, smaller budgets
  - id: 5
    pair: ETHUSD
    budget: 20
    buy_below: 1.0
    sell_above: 1.5
  - id: 6
    pair: ETHUSD
    budget: 20
    buy_below: 2.5
    sell_above: 3.5
