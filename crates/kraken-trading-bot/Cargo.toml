[package]
name = "kraken-trading-bot"
description = "Trading bot on Kraken Spot: managers buying below the market and selling above their cost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not published on crates.io: only kraken-crypto, kraken-network and kraken-spot-api are
publish = false

[[bin]]
name = "kraken-trading-bot"
path = "src/main.rs"

[dependencies]
fastrand.workspace = true
humantime-serde.workspace = true
kraken-spot-api.workspace = true
trading-notify.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
yata.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock.workspace = true
