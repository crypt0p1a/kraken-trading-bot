[package]
name = "trading-notify"
description = "Push notifications of a trading bot on the phone, through ntfy, in several languages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# not published on crates.io: only kraken-crypto, kraken-network and kraken-spot-api are
publish = false

[dependencies]
ntfy.workspace = true
