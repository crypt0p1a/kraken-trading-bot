# Configuration of the managers of kraken-trading-bot: copy it to managers.yaml (ignored by git)
# and edit it. The bot reads managers.yaml (KRAKEN_BOT_CONFIG to read another file).
# The credentials are never written here: KRAKEN_API_KEY / KRAKEN_API_SECRET in the environment

# true: the orders are only validated by Kraken, never placed. Set it to false to trade for real
dry_run: true
# delay between two ticks
tick_interval: 5m
# a buy order not filled after this delay expires, and is placed again from the new price
buy_order_timeout: 12h
# a buy not filled at all is cancelled, then placed again from the new price, once the price rose
# this % above the one it was placed from (missing: it waits for buy_order_timeout)
# buy_trailing: 0.5

# notifications on the phone, through ntfy (topic in KRAKEN_BOT_NTFY_TOPIC):
# notifications:
#   ntfy:
#     server: https://ntfy.sh        # or a self-hosted server
#   language: en                     # en (default) or fr
#   events: [started, placed, filled, expired, failed, daily_summary]   # all by default
#   dry_run: false                   # true: also the orders of a dry run
#   daily_summary_hour: 20           # UTC

# virtual managers: when the account has money no manager uses, the bot adds a copy of one of the
# active managers below, picked at random among the ones it can pay for. Their ids are
# min_virtual_id + 1000 * order of creation + id of the copied manager: the ids below stay < 1000
# virtual_managers:
#   min_virtual_id: 1000000
#   max: 5                           # most virtual managers at the same time
#   fallback_sell_above: 1.5         # rebuilt without its manager nor any sell: sells at cost +1.5%

managers:
  # id: Kraken userref of the orders of the manager, from 1 to 2147483647, unique, never reused
  # budget: in the quote currency of the pair (USD for XBTUSD)
  # buy_below: buys at -buy_below% of the last price
  # sell_above: sells for what the position cost + sell_above%, fees included
  # mode: active (default) | closing (sells what it holds, doesn't buy anymore)
  # bitcoin: from small frequent moves to deep dips
  - id: 1
    pair: XBTUSD
    budget: 30
    buy_below: 0.5
    sell_above: 0.8
  - id: 2
    pair: XBTUSD
    budget: 30
    buy_below: 1.0
    sell_above: 1.5
  - id: 3
    pair: XBTUSD
    budget: 30
    buy_below: 2.0
    sell_above: 3.0
  - id: 4
    pair: XBTUSD
    budget: 30
    buy_below: 3.5
    sell_above: 5.0
  # ether: fewer managers, smaller budgets
  - id: 5
    pair: ETHUSD
    budget: 20
    buy_below: 1.0
    sell_above: 1.5
  - id: 6
    pair: ETHUSD
    budget: 20
    buy_below: 2.5
    sell_above: 3.5
